<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Search</title>
</head>
<body>
    <h1>GitHub User Search</h1>
    <input type="text" id="username-input" placeholder="Enter GitHub username">
    <button id="search-btn">Search</button>
    <div id="profile-card">Profile-Card</div>

    <script>
        async function fetchUser(username) {
            const response = await fetch(`https://api.github.com/users/${username}`);
            const profileCard = document.getElementById("profile-card");

            if (response.ok) {
                const user = await response.json();
                profileCard.innerHTML = `<h2>${user.login}</h2><p>${user.bio || "No bio available"}</p><p>Public Repos: ${user.public_repos}</p>`
            } else {
                profileCard.textContent = "User not found";
            }
        }

        const userInput = document.getElementById("username-input");
        const searchBtn = document.getElementById("search-btn");

        searchBtn.addEventListener("click", () => {
            const username = userInput.value.trim();

            if (username) {
                fetchUser(username)
            }
        });
    </script>
</body>
</html>
